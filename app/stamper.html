<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timbratore · Timbro</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
body{background:var(--wash);min-height:100vh}
main{max-width:440px;margin:0 auto;padding:22px 16px 48px;display:grid;gap:16px}
h1{font-size:24px;font-stretch:112%;font-weight:800}
.cam{position:relative;aspect-ratio:1;border-radius:22px;background:var(--ink);overflow:hidden;display:grid;place-items:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.4)}
.cam .start{position:relative;z-index:1;display:grid;gap:12px;justify-items:center;color:#fff;text-align:center;padding:20px}
.cam .start p{color:#B5B5B8;font-size:15px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}
.code{display:flex;gap:8px}
.code input{font:500 22px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;text-align:center}
.err{font-size:15px;font-weight:600;min-height:1.4em;margin-top:10px}
.err:not(:empty)::before{content:"!";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;margin-right:8px}
.who{text-align:center}
.who h2{font-size:28px;font-stretch:112%;font-weight:800}
.who p{color:var(--muted)}
.found{display:grid;gap:14px;justify-items:center}
.big{font-size:19px;padding:20px;white-space:normal}
.minor{display:flex;gap:8px;width:100%}
.minor .btn{flex:1}
.linked{font-size:14px;color:var(--muted);margin-top:24px}
.linked button{margin-left:6px;font-size:14px}
@media (max-width:420px){.appbar{padding:10px 16px}.appbar .right .btn{display:none}}
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="s.title"></span></a>
  <div class="right"><div class="lang"></div><a class="btn line small" href="dashboard.html" data-i18n="s.dash"></a></div>
</header>

<main>
  <!-- step 0 (connected mode): link this phone to the café once -->
  <section id="link" hidden>
    <h1 style="margin-bottom:8px" data-i18n="s.linkT"></h1>
    <p class="muted" style="margin-bottom:18px" data-i18n="s.linkP"></p>
    <form id="link-form" autocomplete="off">
      <label class="field"><span data-i18n="s.linkCode"></span><input type="text" name="code" maxlength="8" placeholder="AB7K2M9Q" autocapitalize="characters" spellcheck="false" style="font:500 20px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase"></label>
      <label class="field"><span data-i18n="s.linkName"></span><input type="text" name="name" maxlength="40" data-i18n-attr="placeholder:s.linkNamePh"></label>
      <button class="btn pop block" type="submit" data-i18n="s.linkBtn"></button>
      <p class="err" id="link-err" role="alert"></p>
    </form>
  </section>

  <!-- step 1: find the customer -->
  <section id="find">
    <h1 style="margin-bottom:14px" data-i18n="s.scan"></h1>
    <div class="cam" id="cam">
      <div class="start" id="cam-start">
        <button class="btn pop" type="button" id="start" data-i18n="s.camOn"></button>
        <p data-i18n="s.camHint"></p>
      </div>
    </div>
    <p class="or" data-i18n="s.or"></p>
    <form class="code" id="code-form" autocomplete="off">
      <input type="text" name="code" maxlength="6" placeholder="K7M2QX" data-i18n-attr="aria-label:s.code" autocapitalize="characters" spellcheck="false">
      <button class="btn" type="submit" data-i18n="s.find"></button>
    </form>
    <p class="err" id="err" role="alert"></p>
    <p class="linked" id="linked" hidden></p>
  </section>

  <!-- step 2: stamp -->
  <section id="stamp" hidden>
    <div class="found">
      <div class="who"><h2 id="who-name"></h2><p id="who-sub"></p></div>
      <div id="who-pass" style="width:100%;display:grid;justify-items:center"></div>
      <button class="btn pop block big" type="button" id="main-action"></button>
      <div class="minor">
        <button class="btn line" type="button" id="undo" data-i18n="s.undo"></button>
        <button class="btn line" type="button" id="next" data-i18n="s.next"></button>
      </div>
    </div>
  </section>
</main>

<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/remote.js"></script>
<script>
I18N.add({
  it: {
    's.title': 'Timbratore', 's.dash': 'Area locale', 's.scan': 'Inquadra la carta del cliente',
    's.camOn': 'Accendi la fotocamera', 's.camHint': 'Punta il QR sul telefono del cliente.', 's.or': 'oppure scrivi il codice',
    's.code': 'Codice cliente', 's.find': 'Cerca', 's.undo': 'Togli un timbro', 's.next': 'Prossimo cliente',
    's.notFound': 'Nessuna carta con il codice "{code}". Controlla le lettere e riprova.',
    's.camBlocked': 'La fotocamera è bloccata. Consenti l\'accesso nel browser, oppure scrivi il codice qui sotto.',
    's.add': 'Aggiungi un timbro', 's.give': 'Dai il premio: {reward}', 's.sub': '{title} · premi ricevuti: {n}',
    's.linkT': 'Collega questo telefono', 's.linkP': 'Il titolare trova il codice nella sua area, sezione "Cassa". Basta farlo una volta.',
    's.linkCode': 'Codice di collegamento', 's.linkName': 'Nome di questo telefono', 's.linkNamePh': 'Es. Cassa 1, oppure il nome del barista', 's.linkBtn': 'Collega',
    's.linkedTo': 'Collegato a {business} · {name}.', 's.unlink': 'Scollega', 's.unlinkQ': 'Scollegare questo telefono? Per timbrare servirà un nuovo codice.', 's.offline': 'Nessuna connessione. Controlla internet e riprova.',
    's.tAdded': 'Timbro aggiunto ({have}/{need})', 's.tFull': 'Carta piena. Dai il premio!', 's.tGiven': 'Premio dato. La carta riparte.', 's.tRemoved': 'Timbro tolto'
  },
  en: {
    's.title': 'Stamper', 's.dash': 'Dashboard', 's.scan': 'Scan the customer\'s card',
    's.camOn': 'Turn on the camera', 's.camHint': 'Point it at the QR code on the customer\'s phone.', 's.or': 'or type the code',
    's.code': 'Customer code', 's.find': 'Find', 's.undo': 'Remove a stamp', 's.next': 'Next customer',
    's.notFound': 'No card with code "{code}". Check the letters and try again.',
    's.camBlocked': 'The camera is blocked. Allow camera access in your browser, or type the code below.',
    's.add': 'Add a stamp', 's.give': 'Give the reward: {reward}', 's.sub': '{title} · rewards received: {n}',
    's.linkT': 'Link this phone', 's.linkP': 'The owner finds the code in their account, under "Till". You only do this once.',
    's.linkCode': 'Link code', 's.linkName': 'Name for this phone', 's.linkNamePh': 'E.g. Till 1, or the barista\'s name', 's.linkBtn': 'Link',
    's.linkedTo': 'Linked to {business} · {name}.', 's.unlink': 'Unlink', 's.unlinkQ': 'Unlink this phone? You will need a new code to stamp.', 's.offline': 'No connection. Check the internet and try again.',
    's.tAdded': 'Stamp added ({have}/{need})', 's.tFull': 'Card full. Give the reward!', 's.tGiven': 'Reward given. The card starts again.', 's.tRemoved': 'Stamp removed'
  }
});

(() => {
  const $ = id => document.getElementById(id);
  const t = (k, v) => I18N.t(k, v);
  let state = null, stream = null, scanning = false, lastErr = null, busy = false;

  // Same calls in both modes; each returns { customer, card } or null.
  const api = Remote.enabled ? {
    lookup: code => Remote.lookup(code), stamp: (code, d) => Remote.stamp(code, d), redeem: code => Remote.redeem(code)
  } : {
    lookup: async code => { const c = Store.getCustomer(code); return c ? { customer: c, card: Store.getCard(c.cardId) } : null; },
    stamp: async (code, d) => { Store.stamp(code, d); return api.lookup(code); },
    redeem: async code => { Store.redeem(code); return api.lookup(code); }
  };
  const fail = err => { lastErr = null; $('err').textContent = navigator.onLine === false ? t('s.offline') : err.message; UI.toast(navigator.onLine === false ? t('s.offline') : err.message); };

  // ---------- find ----------
  async function open(code) {
    let r;
    try { r = await api.lookup((code || '').trim()); } catch (err) { if (/not linked/i.test(err.message)) return showLink(err.message); fail(err); return false; }
    if (!r) { lastErr = { key: 's.notFound', v: { code: (code || '').toUpperCase() } }; $('err').textContent = t(lastErr.key, lastErr.v); return false; }
    lastErr = null; $('err').textContent = '';
    stopCamera();
    state = r;
    $('find').hidden = true; $('stamp').hidden = false;
    draw();
    $('main-action').focus();
    return true;
  }
  $('code-form').addEventListener('submit', e => { e.preventDefault(); open(e.target.code.value); });

  // ---------- linking the phone (connected mode) ----------
  function showLink(message) {
    stopCamera();
    $('link').hidden = false; $('find').hidden = true; $('stamp').hidden = true;
    $('link-err').textContent = typeof message === 'string' ? message : '';
    return false;
  }
  function showLinked() {
    const d = Remote.device();
    $('linked').hidden = !d;
    if (d) $('linked').innerHTML = `${UI.esc(t('s.linkedTo', { business: d.business, name: d.name || '' }))}<button class="link" type="button" id="unlink">${t('s.unlink')}</button>`;
  }
  $('link-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await Remote.linkDevice(e.target.code.value.trim(), e.target.name.value.trim());
      history.replaceState(null, '', location.pathname);
      $('link').hidden = true; $('find').hidden = false; showLinked();
    } catch (err) { $('link-err').textContent = err.message; }
  });
  document.addEventListener('click', e => {
    if (e.target.id === 'unlink' && confirm(t('s.unlinkQ'))) { Remote.unlinkDevice(); showLink(); }
  });

  // ---------- camera (BarcodeDetector where available, jsQR otherwise) ----------
  let detector = null;
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch (e) {
      lastErr = { key: 's.camBlocked' }; $('err').textContent = t('s.camBlocked');
      return;
    }
    $('cam-start').hidden = true;
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream;
    const frame = document.createElement('div'); frame.className = 'frame';
    $('cam').append(video, frame);
    await video.play();
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    if (!detector && !window.jsQR) await loadScript('../assets/vendor/jsQR.js');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    scanning = true;
    const tick = async () => {
      if (!scanning) return;
      if (video.readyState >= 2) {
        let text = null;
        if (detector) { const r = await detector.detect(video).catch(() => []); text = r[0] && r[0].rawValue; }
        else {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0);
          const r = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
          text = r && r.data;
        }
        if (text && !busy) { busy = true; const found = await open(text.trim()); busy = false; if (found) { navigator.vibrate && navigator.vibrate(40); return; } }
      }
      requestAnimationFrame(tick);
    };
    tick();
  }
  function stopCamera() {
    scanning = false;
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    stream = null;
    $('cam').querySelectorAll('video,.frame').forEach(n => n.remove());
    $('cam-start').hidden = false;
  }
  const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  $('start').addEventListener('click', startCamera);

  // ---------- stamp ----------
  function draw(pop) {
    const { customer: c, card } = state;
    const reward = (I18N.lang === 'en' && card.rewardEn) || card.reward;
    const title = (I18N.lang === 'en' && card.titleEn) || card.title;
    const full = c.stamps >= card.stampsNeeded;
    $('who-name').textContent = c.name;
    $('who-sub').textContent = t('s.sub', { title, n: c.redeemed });
    $('who-pass').innerHTML = UI.renderPass(card, c, { pop, compact: true });
    $('main-action').textContent = full ? t('s.give', { reward }) : t('s.add');
    $('main-action').dataset.mode = full ? 'redeem' : 'stamp';
    $('undo').disabled = c.stamps === 0;
  }
  async function act(fn) {
    if (busy) return; busy = true;
    $('main-action').disabled = $('undo').disabled = true;
    try { return await fn(); } catch (err) { fail(err); } finally { busy = false; $('main-action').disabled = false; if (state) $('undo').disabled = state.customer.stamps === 0; }
  }
  $('main-action').addEventListener('click', e => act(async () => {
    const code = state.customer.id;
    if (e.currentTarget.dataset.mode === 'redeem') { state = await api.redeem(code); draw(); UI.toast(t('s.tGiven')); return; }
    state = await api.stamp(code, 1);
    const { customer: c, card } = state;
    draw(c.stamps - 1);
    navigator.vibrate && navigator.vibrate(30);
    UI.toast(c.stamps >= card.stampsNeeded ? t('s.tFull') : t('s.tAdded', { have: c.stamps, need: card.stampsNeeded }));
  }));
  $('undo').addEventListener('click', () => act(async () => { state = await api.stamp(state.customer.id, -1); draw(); UI.toast(t('s.tRemoved')); }));
  $('next').addEventListener('click', () => {
    state = null; $('stamp').hidden = true; $('find').hidden = false;
    const input = document.querySelector('#code-form input'); input.value = ''; input.focus();
  });

  I18N.switchers();
  I18N.apply();
  document.addEventListener('langchange', () => { if (state) draw(); if (lastErr) $('err').textContent = t(lastErr.key, lastErr.v); showLinked(); });
  if (Remote.enabled) {
    const code = new URLSearchParams(location.search).get('link');
    if (code) $('link-form').code.value = code;
    if (!Remote.device() || code) showLink(); else showLinked();
  } else {
    Store.onChange(async () => { if (state) { state = await api.lookup(state.customer.id); if (state) draw(); } });
  }
})();
</script>
</body>
</html>
