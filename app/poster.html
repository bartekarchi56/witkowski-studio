<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster · Timbro</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/poster.css">
<style id="page-size">@page{size:A5;margin:0}</style>
<style>
body{background:var(--wash)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1.5px solid var(--ink)}
.bar .opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar select{width:auto;min-height:40px;padding:6px 12px}
.sheet{width:min(148mm,calc(100vw - 32px));margin:32px auto}
.sheet.a4{width:min(210mm,calc(100vw - 32px))}
.tip{max-width:148mm;margin:0 auto 40px;padding:0 16px;font-size:14px;color:var(--muted);text-align:center}
@media print{
  body{background:#fff}
  .bar,.tip{display:none}
  .sheet,.sheet.a4{width:100%;margin:0}
  .poster{box-shadow:none;width:100vw;height:100vh;aspect-ratio:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true"></span>Timbro</a>
  <div class="opts">
    <label class="sr-only" for="size">Formato</label>
    <select id="size"><option value="A5">A5</option><option value="A4">A4</option></select>
    <button class="btn pop small" type="button" id="print"></button>
  </div>
</div>
<div class="sheet" id="sheet"></div>
<p class="tip" id="tip"></p>

<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/remote.js"></script>
<script src="../assets/js/marketing.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const id = q.get('card') || 'the-coffee';
  let card = null;
  if (Remote.enabled) { try { card = await Remote.getCard(id); } catch (e) {} }
  else card = Store.getCard(id) || Store.getCard('the-coffee');
  if (!card) { document.getElementById('sheet').textContent = I18N.lang === 'it' ? 'Carta non trovata.' : 'Card not found.'; return; }
  const lang = q.get('lang') === 'en' ? 'en' : 'it';
  const ui = I18N.lang === 'it';
  document.getElementById('sheet').innerHTML = MARKETING.poster(card, { lang });
  document.getElementById('print').textContent = ui ? 'Stampa' : 'Print';
  document.getElementById('tip').textContent = ui
    ? 'Nella finestra di stampa scegli lo stesso formato (A5 o A4), margini "Nessuno" e attiva "Grafica di sfondo".'
    : 'In the print window pick the same paper size (A5 or A4), margins "None" and turn on "Background graphics".';
  document.title = `${card.business} · Poster`;
  const size = document.getElementById('size');
  if (q.get('size') === 'A4') size.value = 'A4';
  function apply() {
    document.getElementById('page-size').textContent = `@page{size:${size.value};margin:0}`;
    document.getElementById('sheet').classList.toggle('a4', size.value === 'A4');
  }
  size.addEventListener('change', apply);
  apply();
  document.getElementById('print').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
