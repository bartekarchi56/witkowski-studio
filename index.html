<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timbro · La carta fedeltà digitale per il tuo bar</title>
<meta name="description" content="Carte fedeltà a timbri sul telefono dei tuoi clienti. Senza app. Ti aiutiamo a disegnarla, stamparla e farla conoscere.">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/poster.css">
<style>
/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1.5px solid var(--ink)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px}
.nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:15px;font-weight:600}
.nav ul a{text-decoration:none}
.nav ul a:hover{text-decoration:underline;text-underline-offset:4px}
.nav .right{display:flex;align-items:center;gap:10px}

section{padding:104px 0}
.head{max-width:720px;margin-bottom:48px}
.head h2{font-size:clamp(32px,4.4vw,56px);margin-top:14px}
.head p{font-size:19px;color:var(--ink-2);margin-top:18px;max-width:36em}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;padding-block:72px 96px}
.hero h1{font-size:clamp(42px,6.4vw,88px);line-height:.96}
.hero h1 .last{white-space:nowrap;position:relative}
.ink-stamp{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-left:.12em;color:var(--pop);transform:rotate(-14deg)}
.ink-stamp.go{animation:inkin .5s cubic-bezier(.2,1.4,.5,1) .25s both,spin 40s linear .75s infinite}
@keyframes spin{from{transform:rotate(-14deg)}to{transform:rotate(346deg)}}
@keyframes inkin{0%{transform:scale(2.2) rotate(-40deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-14deg)}}
.hero .lede{font-size:20px;color:var(--ink-2);max-width:31em;margin:28px 0 34px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:40px 0 0;padding:28px 0 0;list-style:none;border-top:1.5px solid var(--ink);font-weight:600;font-size:15px}
.facts li{display:flex;align-items:center;gap:8px}
.facts li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pop)}
.try{display:grid;justify-items:center;gap:16px}
.try .phone-screen{min-height:0;padding-bottom:30px}
.pview .phone-screen{min-height:440px}
.try-actions{display:flex;gap:8px}
.try-hint{font-size:15px;color:var(--muted);text-align:center;min-height:1.5em}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink);counter-reset:s}
.step{padding:32px 32px 8px 0;counter-increment:s}
.step + .step{padding-left:32px;border-left:1.5px solid var(--line)}
.step::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);font:500 16px/1 var(--mono);margin-bottom:28px}
.step h3{font-size:24px;font-stretch:112%;font-weight:800}
.step p{color:var(--ink-2);margin-top:10px}
.step .who{display:inline-block;margin-top:18px;font:500 12px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* ---------- builder (signature) ---------- */
.builder{background:var(--ink);color:#fff}
.builder .label{color:#A9A9AE}
.builder .head p{color:#C9C9CD}
.bgrid{display:grid;grid-template-columns:400px 1fr;gap:48px;align-items:start}
.bform .field > span{color:#fff}
.bform input[type=text]{background:#1A1A1D;border-color:#3A3A3F;color:#fff;font-size:18px}
.bform input[type=text]:focus{border-color:#fff}
.bform .chips label{background:transparent;border-color:#3A3A3F;color:#fff}
.bform .chips label:hover{border-color:#fff}
.bform .chips input:checked + label{background:#fff;color:var(--ink);border-color:#fff}
.stepper{display:inline-flex;justify-self:start;align-items:center;border:1.5px solid #3A3A3F;border-radius:999px}
.stepper button{width:48px;height:48px;border:0;background:transparent;color:#fff;font:600 22px/1 var(--font);cursor:pointer;border-radius:999px}
.stepper button:hover{background:#1A1A1D}
.stepper output{min-width:48px;text-align:center;font:500 18px var(--mono)}
.bform .btn{margin-top:8px}
.bnote{font-size:14px;color:#A9A9AE;margin-top:14px}
.ptabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.ptabs button{font:600 15px/1 var(--font);padding:11px 16px;border-radius:999px;border:1.5px solid #3A3A3F;background:transparent;color:#fff;cursor:pointer}
.ptabs button[aria-selected="true"]{background:#fff;color:var(--ink);border-color:#fff}
.pview{background:#1A1A1D;border-radius:24px;min-height:600px;display:grid;place-items:center;padding:32px}
.pview[hidden]{display:none}
.pview .poster{max-width:380px}
.pview img{width:100%;max-width:400px;border-radius:6px}
.pcap{font-size:14px;color:#A9A9AE;margin-top:14px;text-align:center}
.b-platform{color:#fff}
.b-platform button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* ---------- custom design gallery ---------- */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.gallery figure{margin:0;background:#000;border-radius:28px;padding:28px 22px;display:grid;justify-items:center;gap:16px}
.gallery figure:nth-child(2){background:var(--wash)}
.gallery figcaption{color:#A9A9AE;font-size:14px;text-align:center}
.gallery figure:nth-child(2) figcaption{color:var(--muted)}
@media (max-width:900px){.gallery{grid-template-columns:1fr;max-width:380px;margin:0 auto}}

/* ---------- what we do ---------- */
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.dolist{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink);counter-reset:do}
.dolist li{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:22px 0;border-bottom:1.5px solid var(--line);counter-increment:do}
.dolist li::before{content:counter(do, decimal-leading-zero);font:600 14px/1 var(--mono);color:var(--muted);margin-top:6px}
.dolist h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.dolist p{color:var(--ink-2);margin-top:4px;font-size:16px}
.kit{margin:0;padding:20px 0 0}
.kit-art{position:relative;max-width:460px}
.kit .poster{max-width:300px;transform:rotate(-2deg);box-shadow:0 0 0 1.5px var(--line),0 30px 50px -30px rgba(0,0,0,.4)}
.sticker{position:absolute;right:0;top:46%;width:180px;height:180px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;transform:rotate(10deg);padding:34px;font-weight:800;font-stretch:110%;font-size:16px;line-height:1.1;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.sticker small{display:block;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#A9A9AE;margin-top:8px;font-stretch:100%}
.sticker::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.4)}
.kit-cap{margin-top:32px;font-size:15px;color:var(--muted);max-width:28em}

/* ---------- pricing ---------- */
.pricing{background:var(--wash)}
.ptop{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.ptop .head{margin-bottom:0}
.bill{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;background:#fff}
.bill button{font:600 15px/1 var(--font);padding:11px 18px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.bill button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bill em{font-style:normal;font:500 12px/1 var(--mono);margin-left:6px;color:var(--pop)}
.bill button[aria-pressed="true"] em{color:#fff;opacity:.8}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.plan{background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:30px;display:flex;flex-direction:column;position:relative}
.plan.popular{box-shadow:0 0 0 2px var(--pop);border-color:var(--pop)}
.plan .badge{position:absolute;top:-13px;left:26px;background:var(--pop);color:#fff;font:600 13px/1 var(--font);padding:7px 12px;border-radius:999px}
.plan h3{font-size:26px;font-stretch:118%;font-weight:800}
.plan .for{color:var(--ink-2);margin-top:6px}
.plan .price{display:flex;align-items:baseline;gap:8px;margin-top:26px}
.plan .price b{font-size:52px;font-weight:800;font-stretch:112%;letter-spacing:-.04em;line-height:1}
.plan .price span{color:var(--muted)}
.plan .billed{font-size:14px;color:var(--muted);min-height:1.5em;margin:8px 0 22px}
.limits{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:12px;margin-bottom:22px}
.limits div{padding:12px 4px;text-align:center}
.limits div + div{border-left:1.5px solid var(--line)}
.limits b{display:block;font-size:22px;font-weight:800}
.limits span{font-size:13px;color:var(--muted)}
.plan ul{list-style:none;margin:0 0 28px;padding:0;flex:1}
.plan li{padding:7px 0 7px 28px;position:relative;font-size:16px}
.plan li::before{content:"";position:absolute;left:2px;top:12px;width:13px;height:7px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg)}
.all{margin-top:24px;text-align:center;color:var(--ink-2)}

/* ---------- faq ---------- */
.faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px}
details{border-bottom:1.5px solid var(--line)}
details:first-child{border-top:1.5px solid var(--ink)}
summary{list-style:none;cursor:pointer;padding:22px 0;font-weight:700;font-size:19px;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(var(--ink),var(--ink)) center/10px 1.5px no-repeat,linear-gradient(var(--ink),var(--ink)) center/1.5px 10px no-repeat}
details[open] summary::after{background:var(--pop) linear-gradient(#fff,#fff) center/10px 1.5px no-repeat;border-color:var(--pop)}
details p{color:var(--ink-2);padding:0 0 22px;max-width:40em}

/* ---------- visit ---------- */
.visit{border-top:1.5px solid var(--ink);padding:88px 0}
.visit .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end}
.visit h2{font-size:clamp(36px,5.4vw,72px)}
.visit p{font-size:19px;color:var(--ink-2);margin-top:18px;max-width:30em}
.visit .ctas{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
footer{background:var(--ink);color:#fff;padding:40px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-size:14px}
footer a{color:#fff;text-decoration:none;opacity:.8}
footer a:hover{opacity:1;text-decoration:underline}
footer nav{display:flex;gap:20px;flex-wrap:wrap}
footer .lang{border-color:#fff}
footer .lang button{color:#fff}
footer .lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* ---------- responsive ---------- */
@media (max-width:1020px){
  .nav ul{display:none}
  .bgrid{grid-template-columns:1fr}
  .help-grid{grid-template-columns:1fr}
  .kit{max-width:420px}
}
@media (max-width:900px){
  .hero,.faq,.visit .wrap{grid-template-columns:1fr}
  .visit .ctas{justify-content:flex-start}
  .steps{grid-template-columns:1fr}
  .step,.step + .step{padding:28px 0;border-left:0;border-bottom:1.5px solid var(--line)}
  .step::before{margin-bottom:18px}
  .plans{grid-template-columns:1fr;max-width:460px;margin:0 auto}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  section{padding:72px 0}
  .hero{padding-block:40px 64px;gap:40px}
  .pview .phone-screen{min-height:0;padding-bottom:28px}
  .hero .lede{font-size:18px}
  .nav .right .login{display:none}
  .nav .wrap{height:60px;gap:10px}
  .nav .btn.small{padding:9px 13px}
  .pview{padding:16px;min-height:0}
  .sticker{width:140px;height:140px;font-size:13px;padding:26px}
  .plan{padding:24px}
}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Timbro"><span class="brand-mark" aria-hidden="true"></span>Timbro</a>
    <ul>
      <li><a href="#come" data-i18n="nav.how"></a></li>
      <li><a href="#prova" data-i18n="nav.try"></a></li>
      <li><a href="#design" data-i18n="nav.help"></a></li>
      <li><a href="#prezzi" data-i18n="nav.pricing"></a></li>
      <li><a href="#faq">FAQ</a></li>
    </ul>
    <div class="right">
      <div class="lang"></div>
      <a class="btn line small login" href="app/dashboard.html" data-i18n="nav.login"></a>
      <a class="btn pop small" href="#prova" data-i18n="nav.start"></a>
    </div>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <div class="wrap hero">
    <div>
      <h1 class="display"><span data-i18n="hero.a"></span> <span class="last"><span data-i18n="hero.b"></span><svg class="ink-stamp go" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
          <path id="ring" d="M50 50m-37 0a37 37 0 1 1 74 0a37 37 0 1 1-74 0"/>
        </defs>
        <g filter="url(#rough)" fill="none" stroke="currentColor">
          <circle cx="50" cy="50" r="47" stroke-width="4"/>
          <circle cx="50" cy="50" r="29" stroke-width="2"/>
          <text font-family="Spline Sans Mono, monospace" font-size="9.5" font-weight="500" fill="currentColor" stroke="none"><textPath textLength="226" lengthAdjust="spacing" href="#ring">TIMBRO · MILANO · TIMBRO · MILANO ·</textPath></text>
          <path transform="translate(35 35) scale(1.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 9h12v4.5A5.5 5.5 0 0 1 10.5 19h-1A5.5 5.5 0 0 1 4 13.5zM16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c-.8 1 .8 2 0 3M12 3.5c-.8 1 .8 2 0 3"/>
        </g>
      </svg></span></h1>
      <p class="lede" data-i18n="hero.lede"></p>
      <div class="ctas">
        <a class="btn pop" href="#prova" data-i18n="hero.cta1"></a>
        <a class="btn line" href="#come" data-i18n="hero.cta2"></a>
      </div>
      <ul class="facts">
        <li data-i18n="hero.f1"></li>
        <li data-i18n="hero.f2"></li>
        <li data-i18n="hero.f3"></li>
      </ul>
    </div>
    <div class="try">
      <div class="platform" id="hero-platform"></div>
      <div class="phone"><div class="phone-screen" id="hero-pass"></div></div>
      <div class="try-actions">
        <button class="btn pop" type="button" id="hero-stamp"></button>
        <button class="btn line" type="button" id="hero-reset" data-i18n="hero.reset"></button>
      </div>
      <p class="try-hint" id="hero-hint" aria-live="polite"></p>
    </div>
  </div>

  <!-- HOW -->
  <section id="come" style="padding-top:0">
    <div class="wrap">
      <div class="head">
        <span class="label" data-i18n="how.label"></span>
        <h2 class="display" data-i18n="how.title"></h2>
      </div>
      <ol class="steps">
        <li class="step"><h3 data-i18n="how.s1"></h3><p data-i18n="how.s1p"></p><span class="who" data-i18n="how.s1w"></span></li>
        <li class="step"><h3 data-i18n="how.s2"></h3><p data-i18n="how.s2p"></p><span class="who" data-i18n="how.s2w"></span></li>
        <li class="step"><h3 data-i18n="how.s3"></h3><p data-i18n="how.s3p"></p><span class="who" data-i18n="how.s3w"></span></li>
      </ol>
    </div>
  </section>

  <!-- BUILDER -->
  <section id="prova" class="builder">
    <div class="wrap">
      <div class="head">
        <span class="label" data-i18n="b.label"></span>
        <h2 class="display" data-i18n="b.title"></h2>
        <p data-i18n="b.lede"></p>
      </div>
      <div class="bgrid">
        <form class="bform" id="bform" autocomplete="off">
          <label class="field"><span data-i18n="b.name"></span>
            <input type="text" name="name" maxlength="28" value="The Coffee" data-i18n-attr="placeholder:b.namePh">
          </label>
          <fieldset class="field" style="border:0;padding:0;margin:0 0 18px">
            <legend style="font-weight:600;font-size:15px;margin-bottom:8px;padding:0" data-i18n="b.type"></legend>
            <div class="chips" id="types"></div>
          </fieldset>
          <label class="field"><span data-i18n="b.reward"></span>
            <input type="text" name="reward" maxlength="40">
          </label>
          <div class="field">
            <span id="stamps-l" data-i18n="b.stamps"></span>
            <div class="stepper" role="group" aria-labelledby="stamps-l">
              <button type="button" data-step="-1" aria-label="−1">−</button>
              <output id="stamps" aria-live="polite">10</output>
              <button type="button" data-step="1" aria-label="+1">+</button>
            </div>
          </div>
          <a class="btn pop block" id="b-go" href="app/dashboard.html" data-i18n="b.go"></a>
          <p class="bnote" data-i18n="b.note"></p>
        </form>
        <div>
          <div class="ptabs" role="tablist" aria-label="Preview">
            <button role="tab" aria-selected="true" aria-controls="pv-phone" id="pt-phone" data-i18n="b.tPhone"></button>
            <button role="tab" aria-selected="false" aria-controls="pv-poster" id="pt-poster" data-i18n="b.tPoster" tabindex="-1"></button>
            <button role="tab" aria-selected="false" aria-controls="pv-insta" id="pt-insta" data-i18n="b.tInsta" tabindex="-1"></button>
          </div>
          <div class="pview" role="tabpanel" id="pv-phone" aria-labelledby="pt-phone">
            <div style="display:grid;justify-items:center;gap:16px"><div class="platform b-platform" id="b-platform"></div><div class="phone"><div class="phone-screen" id="b-pass"></div></div><p class="pcap" data-i18n="b.cPhone"></p></div>
          </div>
          <div class="pview" role="tabpanel" id="pv-poster" aria-labelledby="pt-poster" hidden>
            <div style="width:100%;max-width:380px"><div id="b-poster"></div><p class="pcap" data-i18n="b.cPoster"></p></div>
          </div>
          <div class="pview" role="tabpanel" id="pv-insta" aria-labelledby="pt-insta" hidden>
            <div style="width:100%;max-width:400px"><img id="b-insta" alt=""><p class="pcap" data-i18n="b.cInsta"></p></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CUSTOM DESIGN -->
  <section id="design">
    <div class="wrap">
      <div class="head">
        <span class="label" data-i18n="ds.label"></span>
        <h2 class="display" data-i18n="ds.title"></h2>
        <p data-i18n="ds.lede"></p>
      </div>
      <div class="gallery" id="gallery"></div>
      <ol class="steps" style="margin-top:56px">
        <li class="step"><h3 data-i18n="ds.s1"></h3><p data-i18n="ds.s1p"></p></li>
        <li class="step"><h3 data-i18n="ds.s2"></h3><p data-i18n="ds.s2p"></p></li>
        <li class="step"><h3 data-i18n="ds.s3"></h3><p data-i18n="ds.s3p"></p></li>
      </ol>
    </div>
  </section>

  <!-- WHAT WE DO -->
  <section id="aiuto">
    <div class="wrap help-grid">
      <div>
        <div class="head" style="margin-bottom:36px">
          <span class="label" data-i18n="h.label"></span>
          <h2 class="display" data-i18n="h.title"></h2>
          <p data-i18n="h.lede"></p>
        </div>
        <ul class="dolist">
          <li><div><h3 data-i18n="h.1"></h3><p data-i18n="h.1p"></p></div></li>
          <li><div><h3 data-i18n="h.2"></h3><p data-i18n="h.2p"></p></div></li>
          <li><div><h3 data-i18n="h.3"></h3><p data-i18n="h.3p"></p></div></li>
          <li><div><h3 data-i18n="h.4"></h3><p data-i18n="h.4p"></p></div></li>
          <li><div><h3 data-i18n="h.5"></h3><p data-i18n="h.5p"></p></div></li>
          <li><div><h3 data-i18n="h.6"></h3><p data-i18n="h.6p"></p></div></li>
        </ul>
      </div>
      <figure class="kit">
        <div class="kit-art">
          <div id="kit-poster"></div>
          <div class="sticker" aria-hidden="true"><div><span data-i18n="h.sticker"></span><small data-i18n="h.stickerSub"></small></div></div>
        </div>
        <figcaption class="kit-cap" data-i18n="h.kitCap"></figcaption>
      </figure>
    </div>
  </section>

  <!-- PRICING -->
  <section id="prezzi" class="pricing">
    <div class="wrap">
      <div class="ptop">
        <div class="head">

(() => {
  const L = () => I18N.lang;
  const fmt = (n, dec = 0) => new Intl.NumberFormat(L() === 'it' ? 'it-IT' : 'en-IE', { style: 'currency', currency: 'EUR', minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);

  // ---------- hero: a card you can stamp ----------
  const heroCard = () => Store.getCard('the-coffee');
  let n = 3, hint = 'hero.h0', hintVars;
  const heroBtn = document.getElementById('hero-stamp');
  function hero(pop) {
    const card = heroCard();
    document.getElementById('hero-pass').innerHTML = UI.renderPass(card, null, { stamps: n, pop });
    heroBtn.textContent = I18N.t(n >= card.stampsNeeded ? 'hero.redeem' : 'hero.stamp');
    document.getElementById('hero-hint').textContent = I18N.t(hint, hintVars);
  }
  heroBtn.addEventListener('click', () => {
    const need = heroCard().stampsNeeded;
    if (n >= need) { n = 0; hint = 'hero.hDone'; hero(); return; }
    n++;
    if (n >= need) hint = 'hero.hFull'; else { hint = 'hero.hLeft'; hintVars = { n: need - n }; }
    hero(n - 1);
  });
  document.getElementById('hero-reset').addEventListener('click', () => { n = 0; hint = 'hero.h0'; hero(); });

  // ---------- builder ----------
  const form = document.getElementById('bform');
  const typesBox = document.getElementById('types');
  let stamps = 10, rewardTouched = false, typeId = 'caffe', styleId = 'timbro';
  function drawTypes() {
    typesBox.innerHTML = CONFIG.templates.map(tp =>
      `<input type="radio" name="type" id="ty-${tp.id}" value="${tp.id}" ${tp.id === typeId ? 'checked' : ''}><label for="ty-${tp.id}">${UI.icon(tp.icon)}${UI.esc(I18N.pick(tp).type)}</label>`).join('');
  }
  function drawStyles() {
    if (!document.getElementById('bstyles')) return;
    document.getElementById('bstyles').innerHTML = CONFIG.styles.map(st =>
      `<input type="radio" name="bstyle" id="bs-${st.id}" value="${st.id}" ${st.id === styleId ? 'checked' : ''}><label for="bs-${st.id}"><span style="width:14px;height:14px;border-radius:50%;background:${st.look.ink};box-shadow:0 0 0 2px ${st.look.color === '#FFFFFF' ? '#3A3A3F' : st.look.color}"></span>${UI.esc(I18N.pick(st))}</label>`).join('');
  }
  const tpl = () => CONFIG.templates.find(tp => tp.id === typeId);
  function builderCard() {
    const tp = tpl(), main = I18N.pick(tp);
    const reward = form.reward.value.trim() || main.reward;
    const card = {
      id: 'preview', business: form.name.value.trim() || I18N.t('b.namePh').replace(/^(Es\.|E\.g\.)\s*/, ''),
      title: main.title, reward, stampsNeeded: stamps, icon: tp.icon,
      ...CONFIG.styles.find(st => st.id === styleId).look, style: styleId
    };
    if (styleId === 'giappone' && /coffee/i.test(card.business)) card.tagline = 'ザ・コーヒー';
    if (L() === 'it') { card.titleEn = tp.en.title; if (reward === tp.it.reward) card.rewardEn = tp.en.reward; }
    return card;
  }
  let instaTimer;
  function builder() {
    const card = builderCard();
    document.getElementById('b-pass').innerHTML = UI.renderPass(card, null, { stamps: Math.min(3, stamps) });
    document.getElementById('b-poster').innerHTML = MARKETING.poster(card, { url: UI.publicUrl('') });
    document.getElementById('stamps').textContent = stamps;
    const q = new URLSearchParams({ new: 1, name: card.business, type: typeId, style: styleId, reward: card.reward, stamps, lang: L() });
    document.getElementById('b-go').href = 'app/dashboard.html?' + q;
    clearTimeout(instaTimer);
    instaTimer = setTimeout(async () => {
      const cv = await MARKETING.instagram(card, L());
      const img = document.getElementById('b-insta');
      img.src = cv.toDataURL('image/png');
      img.alt = I18N.t('b.tInsta') + ': ' + card.business;
    }, 180);
  }
  form.addEventListener('input', e => { if (e.target.name === 'reward') rewardTouched = true; builder(); });
  form.addEventListener('change', e => {
    if (e.target.name === 'bstyle') { styleId = e.target.value; builder(); return; }
    if (e.target.name === 'type') {
      typeId = e.target.value;
      stamps = tpl().stamps;
      if (!rewardTouched) form.reward.value = I18N.pick(tpl()).reward;
      builder();
    }
  });
  form.addEventListener('submit', e => e.preventDefault());
  form.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    stamps = Math.max(3, Math.min(15, stamps + +b.dataset.step)); builder();
  }));

  // preview tabs
  const ptabs = [...document.querySelectorAll('.ptabs [role=tab]')];
  function showTab(tab) {
    ptabs.forEach(x => {
      const on = x === tab;
      x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
    });
  }
  ptabs.forEach((x, i) => {
    x.addEventListener('click', () => showTab(x));
    x.addEventListener('keydown', e => {
      const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) { const nx = ptabs[(i + d + ptabs.length) % ptabs.length]; nx.focus(); showTab(nx); }
    });
  });

  // ---------- kit ----------
  function kit() { document.getElementById('kit-poster').innerHTML = MARKETING.poster(heroCard()); }

  // ---------- pricing ----------
  let bill = 'month';
  function plans() {
    document.getElementById('plans').innerHTML = CONFIG.plans.map(p => {
      const tx = I18N.pick(p);
      const yearly = p.month * CONFIG.yearlyMonths;
      const price = bill === 'year' ? fmt(yearly) : fmt(p.month);
      const billed = bill === 'year' ? I18N.t('p.billedY', { x: fmt(yearly / 12, 2) }) : I18N.t('p.billedM');
      const lim = (v, one, many) => `<div><b>${v}</b><span>${I18N.t(v === 1 ? one : many)}</span></div>`;
      return `<article class="plan${p.popular ? ' popular' : ''}">
        ${p.popular ? `<span class="badge">${I18N.t('p.popular')}</span>` : ''}
        <h3>${tx.name}</h3><p class="for">${tx.for}</p>
        <div class="price"><b>${price}</b><span>${I18N.t(bill === 'year' ? 'p.year' : 'p.month')}</span></div>
        <p class="billed">${billed}</p>
        <div class="limits">${lim(p.locations, 'p.loc1', 'p.loc')}${lim(p.cards, 'p.cards1', 'p.cards')}${lim(p.staff, 'p.staff', 'p.staff')}</div>
        <ul>${tx.extras.map(x => `<li>${x}</li>`).join('')}</ul>
        <a class="btn ${p.popular ? 'pop' : 'line'} block" href="#prova">${I18N.t('p.cta')}</a>
      </article>`;
    }).join('');
  }
  document.querySelectorAll('.bill button').forEach(b => b.addEventListener('click', () => {
    bill = b.dataset.bill;
    document.querySelectorAll('.bill button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    plans();
  }));

  // ---------- contact ----------
  function contact() {
    const c = CONFIG.contact, out = [];
    if (c.phone) out.push(`<a class="btn pop" href="https://wa.me/${c.phone.replace(/\D/g, '')}">${I18N.t('v.wa')}</a>`);
    if (c.email) out.push(`<a class="btn line" href="mailto:${c.email}">${I18N.t('v.mail')}</a>`);
    if (!out.length) out.push(`<a class="btn pop" href="#prova">${I18N.t('v.start')}</a>`);
    document.getElementById('contact').innerHTML = out.join('');
  }

  // ---------- custom design examples ----------
  function gallery() {
    const ex = [
      [Store.getCard('the-coffee'), 'ds.g1'],
      [{ business: 'Forno Bottega', title: 'Carta pane', reward: 'una focaccia gratis', titleEn: 'Bread card', rewardEn: 'a free focaccia', stampsNeeded: 8, icon: 'cake', ...CONFIG.styles.find(x => x.id === 'bottega').look, tagline: 'dal 1962' }, 'ds.g2'],
      [{ business: 'Bar Brera', title: 'Carta aperitivo', reward: 'uno spritz gratis', titleEn: 'Aperitivo card', rewardEn: 'a free spritz', stampsNeeded: 8, icon: 'glass', ...CONFIG.styles.find(x => x.id === 'milano').look }, 'ds.g3']
    ];
    document.getElementById('gallery').innerHTML = ex.map(([c, k]) => `<figure>${UI.renderPass(c, null, { stamps: 5, platform: 'apple' })}<figcaption>${I18N.t(k)}</figcaption></figure>`).join('');
  }

  function all() {
    I18N.apply();
    hero(); drawTypes(); drawStyles();
    if (!rewardTouched) form.reward.value = I18N.pick(tpl()).reward;
    builder(); kit(); plans(); contact(); gallery();
    document.title = L() === 'it' ? 'Timbro · La carta fedeltà digitale per il tuo bar' : 'Timbro · The digital loyalty card for your café';
  }
  // ?bar=Name (used by the brochure QR) opens the builder with that name.
  const bar = new URLSearchParams(location.search).get('bar');
  if (bar) { form.name.value = bar.slice(0, 28); if (!location.hash) location.hash = '#prova'; }

  UI.platformSwitch(document.getElementById('hero-platform'), () => { hero(); builder(); });
  UI.platformSwitch(document.getElementById('b-platform'), () => { hero(); builder(); });
  I18N.switchers();
  document.addEventListener('langchange', all);
  all();
})();
</script>
</body>
</html>
