<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit vendita · Timbro</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
main{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:clamp(34px,4.6vw,56px)}
.intro{font-size:19px;color:var(--ink-2);max-width:38em;margin:16px 0 32px}
.who{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px;border:1.5px solid var(--ink);border-radius:16px;position:sticky;top:0;background:#fff;z-index:5}
.who .field{margin:0}
.who .field > span{font-size:13px}
.who input{min-height:42px;padding:8px 10px;font-size:15px}
section{margin-top:72px}
section > h2{font-size:clamp(26px,3vw,36px);margin-bottom:10px}
section > .sub{color:var(--ink-2);max-width:40em;margin-bottom:26px}
.two{display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:start}
.script{list-style:none;margin:0;padding:0;counter-reset:s;border-top:1.5px solid var(--ink)}
.script li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-bottom:1.5px solid var(--line)}
.script li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:500 14px/1 var(--mono)}
.script b{display:block;font-size:15px;margin-bottom:4px}
.script q{display:block;font-size:17px;quotes:"«" "»"}
.script .tr{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.card-ready{border:1.5px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;justify-items:start;position:sticky;top:130px}
.card-ready .qr{width:160px}
.card-ready .qr svg{width:100%;height:auto}
.when{list-style:none;margin:0;padding:0}
.when li{display:flex;gap:10px;padding:8px 0;border-bottom:1.5px solid var(--line);font-size:15px}
.when li:last-child{border-bottom:0}
.when .y,.when .n{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.when .y{background:var(--pop);color:#fff}
.when .n{border:1.5px solid var(--ink)}
.obj{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.obj article{border:1.5px solid var(--line);border-radius:14px;padding:18px}
.obj h3{font-size:16px;margin-bottom:6px}
.obj p{color:var(--ink-2);font-size:15px}
.obj .tr{color:var(--muted);font-size:14px;margin-top:6px}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.langs button{font:600 14px/1 var(--font);padding:10px 14px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tpls{display:grid;gap:14px}
.tpl{border:1.5px solid var(--line);border-radius:16px;padding:20px}
.tpl header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tpl h3{font-size:17px}
.tpl .when-send{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.tpl .acts{display:flex;gap:6px}
.tpl .subj{font-weight:700;margin-bottom:8px}
.tpl pre{white-space:pre-wrap;font:400 15px/1.55 var(--font);margin:0;color:var(--ink-2)}
.cadence{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cadence li{border-top:3px solid var(--ink);padding-top:12px}
.cadence li:first-child{border-color:var(--pop)}
.cadence b{display:block;font:500 13px/1 var(--mono);text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.goals div{background:var(--wash);border-radius:14px;padding:18px}
.goals b{display:block;font-size:30px;font-weight:800;font-stretch:112%}
.legal{margin-top:24px}
@media (max-width:900px){
  .who{grid-template-columns:1fr 1fr;position:static}
  .two,.obj{grid-template-columns:1fr}
  .card-ready{position:static}
  .cadence,.goals{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){ main{padding:24px 16px 56px} .cadence,.goals{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span>Timbro</a>
  <div class="right"><div class="lang"></div><a class="btn line small" href="brochure.html" data-i18n="o.brochure"></a></div>
</header>
<main>
  <span class="label" data-i18n="o.label"></span>
  <h1 class="display" data-i18n="o.title"></h1>
  <p class="intro" data-i18n="o.intro"></p>

  <form class="who" id="who" autocomplete="off">
    <label class="field"><span data-i18n="o.me"></span><input type="text" name="me"></label>
    <label class="field"><span data-i18n="o.cafe"></span><input type="text" name="cafe"></label>
    <label class="field"><span data-i18n="o.city"></span><input type="text" name="city"></label>
    <label class="field"><span data-i18n="o.phone"></span><input type="tel" name="phone"></label>
    <label class="field"><span data-i18n="o.email"></span><input type="email" name="email"></label>
  </form>

  <!-- IN PERSON -->
  <section>
    <h2 class="display" data-i18n="o.visitT"></h2>
    <p class="sub" data-i18n="o.visitSub"></p>
    <div class="two">
      <ol class="script" id="script"></ol>
      <aside class="card-ready">
        <span class="label" data-i18n="o.readyL"></span>
        <p data-i18n="o.readyP"></p>
        <div class="qr" id="ready-qr"></div>
        <a class="btn pop small" id="ready-link" target="_blank" rel="noopener" data-i18n="o.readyBtn"></a>
        <a class="link" id="brochure-link" target="_blank" rel="noopener" data-i18n="o.brochureFor"></a>
        <h3 style="font-size:16px;margin-top:10px" data-i18n="o.whenT"></h3>
        <ul class="when" id="when"></ul>
      </aside>
    </div>
    <h3 style="font-size:22px;margin:40px 0 14px" data-i18n="o.objT"></h3>
    <div class="obj" id="obj"></div>
  </section>

  <!-- MESSAGES -->
  <section>
    <h2 class="display" data-i18n="o.msgT"></h2>
    <p class="sub" data-i18n="o.msgSub"></p>
    <div class="langs" role="group" data-i18n-attr="aria-label:o.msgLang" id="mlangs"></div>
    <div class="tpls" id="tpls"></div>
    <p class="help legal"><span data-i18n-html="o.legal"></span></p>
  </section>

  <!-- RHYTHM -->
  <section>
    <h2 class="display" data-i18n="o.rhythmT"></h2>
    <p class="sub" data-i18n="o.rhythmSub"></p>
    <ol class="cadence" id="cadence"></ol>
    <div class="goals" id="goals"></div>
  </section>
</main>

ich melde mich noch einmal wegen der Treuekarte für {cafe}. Das Beispiel ist weiterhin hier:
{link}

In 10 Minuten sehen Sie, wie es funktioniert. Darf ich Sie diese Woche kurz anrufen?

Danke und viele Grüße
{me}
{phone}` },
    { t: 'Kurze Nachricht (Instagram oder WhatsApp)', w: 'Tag 0', body:
`Hallo! Ich bin {me} von {brand}. Ich habe eine digitale Treuekarte für {cafe} vorbereitet: Sie ist auf dem Handy der Gäste, ohne App. So würde sie aussehen: {link}
Darf ich sie Ihnen zeigen? Es dauert 10 Minuten.` },
    { t: 'Nach dem Besuch (WhatsApp)', w: 'Am selben Tag', body:
`Hallo, hier ist {me} von {brand}. Danke für Ihre Zeit heute im {cafe}! Hier ist Ihre Karte: {link}
Der erste Monat ist kostenlos, wir können also gleich diese Woche starten. Einen schönen Tag noch!` }
  ]}
};
const CADENCE = {
  it: [['Giorno 0', 'Visita, oppure prima email o messaggio.'], ['Giorno 0', 'Dopo la visita: messaggio WhatsApp con il link alla loro carta.'], ['Giorno 4', 'Email o messaggio di richiamo. Breve.'], ['Giorno 7–10', 'Seconda visita, il pomeriggio. Poi basta: chiudi con gentilezza.']],
  en: [['Day 0', 'Visit, or first email or message.'], ['Day 0', 'After a visit: WhatsApp message with the link to their card.'], ['Day 4', 'Follow-up email or message. Keep it short.'], ['Day 7–10', 'Second visit, in the afternoon. Then stop: close politely.']]
};

(() => {
  const $ = id => document.getElementById(id);
  const form = $('who');
  const KEY = 'timbro:outreach';
  let mlang = 'it';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  form.me.value = saved.me ?? CONFIG.contact.name;
  form.cafe.value = saved.cafe ?? 'The Coffee';
  form.city.value = saved.city ?? CONFIG.contact.city;
  form.phone.value = saved.phone ?? CONFIG.contact.phone;
  form.email.value = saved.email ?? CONFIG.contact.email;

  const vals = () => {
    const o = Object.fromEntries(new FormData(form));
    const fmt = new Intl.NumberFormat(mlang === 'en' ? 'en-IE' : mlang + '-' + mlang.toUpperCase(), { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
    return { ...o, me: o.me || '…', cafe: o.cafe || '…', brand: CONFIG.brand, price: fmt.format(CONFIG.plans[0].month),
      link: UI.publicUrl('?bar=' + encodeURIComponent(o.cafe || '') + '&lang=' + (mlang === 'it' ? 'it' : 'en') + '#prova') };
  };
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '').replace(/\n{3,}/g, '\n\n').trim();

  function render() {
    const o = Object.fromEntries(new FormData(form));
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
    const ui = I18N.lang, v = vals();
    const vIt = { ...v, price: new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(CONFIG.plans[0].month) };

    $('script').innerHTML = SCRIPT.map(s => `<li><div><b>${UI.esc(s[ui][0])}</b><q lang="it">${UI.esc(fill(s.it[1], vIt))}</q>${ui === 'en' ? `<span class="tr">${UI.esc(fill(s.en[1], vIt))}</span>` : ''}</div></li>`).join('');
    $('obj').innerHTML = OBJ.map(s => `<article><h3>${UI.esc(s.it[0])}</h3><p lang="it">${UI.esc(fill(s.it[1], vIt))}</p>${ui === 'en' ? `<p class="tr">${UI.esc(s.en[0])} ${UI.esc(fill(s.en[1], vIt))}</p>` : ''}</article>`).join('');
    $('when').innerHTML = WHEN[ui].map(([k, t]) => `<li><span class="${k}" aria-hidden="true">${k === 'y' ? '✓' : '×'}</span>${UI.esc(t)}</li>`).join('');

    $('ready-link').href = new URL('../index.html?bar=' + encodeURIComponent(o.cafe || '') + '#prova', location.href).href;
    $('ready-qr').innerHTML = UI.qrSvg(v.link.replace(/lang=\w+/, 'lang=it'));
    $('brochure-link').href = 'brochure.html?cafe=' + encodeURIComponent(o.cafe || '');

    $('mlangs').innerHTML = Object.entries(TPL).map(([k, x]) => `<button type="button" data-l="${k}" lang="${k}" aria-pressed="${k === mlang}">${x.name}</button>`).join('');
    $('tpls').innerHTML = TPL[mlang].items.map((tp, i) => `
      <article class="tpl" lang="${mlang}">
        <header><div><h3>${UI.esc(tp.t)}</h3><p class="when-send">${UI.esc(tp.w)}</p></div>
          <div class="acts">${tp.subj ? `<a class="btn line small" href="mailto:?subject=${encodeURIComponent(fill(tp.subj, v))}&body=${encodeURIComponent(fill(tp.body, v))}">${I18N.t('o.openMail')}</a>` : ''}
          <button class="btn small" type="button" data-copy="${i}">${I18N.t('o.copy')}</button></div></header>
        ${tp.subj ? `<p class="subj">${UI.esc(fill(tp.subj, v))}</p>` : ''}
        <pre>${UI.esc(fill(tp.body, v))}</pre>
      </article>`).join('');

    $('cadence').innerHTML = CADENCE[ui].map(([d, t]) => `<li><b>${UI.esc(d)}</b>${UI.esc(t)}</li>`).join('');
    $('goals').innerHTML = [['10', 'o.goal1'], ['2', 'o.goal2'], [ui === 'it' ? CONFIG.trialDays + ' giorni' : CONFIG.trialDays + ' days', 'o.goal3']].map(([n, k]) => `<div><b>${n}</b>${I18N.t(k)}</div>`).join('');
  }

  form.addEventListener('input', render);
  $('mlangs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { mlang = b.dataset.l; render(); } });
  $('tpls').addEventListener('click', e => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    const tp = TPL[mlang].items[+b.dataset.copy], v = vals();
    UI.copy((tp.subj ? fill(tp.subj, v) + '\n\n' : '') + fill(tp.body, v));
  });
  I18N.switchers();
  document.addEventListener('langchange', render);
  I18N.apply();
  render();
})();
</script>
</body>
</html>
